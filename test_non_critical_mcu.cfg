# Test configuration for non-critical MCU support
# This is an example configuration showing how to use the is_non_critical option

[mcu]
serial: /dev/ttyACM0

[mcu door_sensor]
serial: /dev/ttyACM1
is_non_critical: True
reconnect_interval: 2.0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# Example of using the door sensor MCU for a digital input
[output_pin door_led]
pin: door_sensor:PA1
value: 0
