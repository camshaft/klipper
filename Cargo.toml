# Klipper Rust Workspace
#
# Flat crates directory for easier upstream merging

[workspace]
members = [
    "crates/chelper_rs",
]
resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Klipper Contributors"]
repository = "https://github.com/Klipper3d/klipper"

[workspace.dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py37"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
